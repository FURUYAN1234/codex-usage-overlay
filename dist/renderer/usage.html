<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Codex Usage / Codex 残量</title><link rel="stylesheet" href="./usage.css">
</head><body>
<header class="titlebar"><div><span class="brand" aria-hidden="true">C</span><h1>Codex Usage / <span lang="ja">Codex 残量</span></h1></div><div class="window-actions"><button id="pin" aria-pressed="true" title="Always on top / 常に手前に表示">Pin / <span lang="ja">最前面</span></button><button id="hide" title="Hide to tray / トレイに収納" aria-label="Hide to tray / トレイに収納">×</button></div></header>
<main><div class="intro"><p>Usage remaining / <span lang="ja">利用枠の残り</span></p><span id="plan"></span></div>
<section id="buckets" aria-label="Usage remaining / 利用枠の残り"></section>
<section class="credit-card" aria-labelledby="credit-heading"><div class="credit-top"><h2 id="credit-heading">Credit balance / <span lang="ja">クレジット残高</span></h2></div><p id="credits" class="credit-value">Loading… / 取得中…</p><p id="credit-note" class="credit-note">Checking balance / 残高を確認しています</p></section>
<p id="error" class="error" role="status" hidden></p></main>
<footer><div><p id="status" role="status">Connecting… / 接続しています…</p><p class="interval">Auto-refresh every 5 min / <span lang="ja">5分ごとに自動更新</span></p></div><button id="refresh" class="refresh" type="button">Refresh / 更新</button></footer>
<script type="module" src="./usage-ui.js"></script></body></html>
